# Distributed across all instances that share coraza_ratelimit_key.
# 500 requests / 10 s across the whole cluster; Redis sync every 2 s.
SecRuleEngine On
SecRule ARGS:id "@eq 1" "id:1, phase:1, pass, \
    ratelimit:zone[]=%{REQUEST_HEADERS.host}&events=500&window=10&action=deny&status=429&distribute_interval=2, \
    status:200"
